server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jobsearch}
spring.data.mongodb.auto-index-creation=true
# JWT: set a long random secret (32+ chars) in production
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.seed.enabled=${SEED_DATA:true}
server.error.include-message=always
